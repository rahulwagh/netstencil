name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate every sample against the netstencil/1 schema
        run: |
          set -e
          for f in samples/*.netstencil.json; do
            npx --yes -p ajv-cli@5 -p ajv-formats@2 ajv validate --spec=draft2020 -c ajv-formats --strict=true -s schema/design.schema.json -d "$f"
          done
